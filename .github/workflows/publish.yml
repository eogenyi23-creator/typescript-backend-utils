# Publishes the package to npm when a version tag (v*.*.*) is pushed.
#
# Prerequisites:
#   1. Set the NPM_TOKEN secret in repo Settings -> Secrets -> Actions
#      (create a token at https://www.npmjs.com/settings/<user>/tokens with
#      "Automation" type)
#   2. Ensure package.json "name" matches your npm package name
#
# Trigger:
#   git tag v0.1.0 && git push origin v0.1.0

name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Type-check examples
        run: npm run check:examples

      - name: Check README examples match example files
        run: npm run check:readme-examples

      - name: Check claims audit
        run: npm run check:claims

      - name: Run unit tests
        run: npm test -- --testPathIgnorePatterns="tests/integration"

      - name: Run unit tests with coverage
        run: npm run test:coverage -- --testPathIgnorePatterns="tests/integration"

  integration-tests:
    name: Integration Tests (Redis)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run integration tests
        run: npm run test:integration
        env:
          REDIS_URL: redis://localhost:6379

  contract:
    name: Contract (kv-test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt,clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            testnet/contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('testnet/contract/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: testnet/contract
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: testnet/contract
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: testnet/contract
        run: cargo test --locked

      - name: Install stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v30.0.1/stellar-cli-30.0.1-x86_64-unknown-linux-gnu.tar.gz \
            -o /tmp/stellar-cli.tar.gz
          tar xzf /tmp/stellar-cli.tar.gz -C /tmp
          sudo mv /tmp/stellar /usr/local/bin/stellar
          stellar --version

      - name: Build WASM
        working-directory: testnet/contract
        run: stellar contract build

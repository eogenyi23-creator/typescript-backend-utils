[workspace]
members = ["kv-test"]
resolver = "2"

# ---------------------------------------------------------------------------
# Dependency pin — ed25519-dalek
# ---------------------------------------------------------------------------
# soroban-env-host 22.1.3 declares `ed25519-dalek = ">=2.0.0"` and was
# written against the rand_core 0.6 CryptoRng API (ed25519-dalek 2.x).
# Without intervention, Cargo resolves that constraint to ed25519-dalek 3.0.0,
# which switched to rand_core 0.10 — a semver-incompatible CryptoRng trait.
# soroban-env-host's testutils then fails to compile because ChaCha20Rng
# (rand_core 0.6) does not satisfy the rand_core 0.10 CryptoRng bound.
#
# Fix: Cargo.lock is committed with ed25519-dalek pinned to 2.2.0 (applied
# once with `cargo update ed25519-dalek@3.0.0 --precise 2.2.0`).  As long as
# `cargo test` is run with `--locked` or the Cargo.lock is respected, the
# 3.0.0 version is never selected.  CI uses the committed Cargo.lock.

[profile.release]
codegen-units = 1
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
lto = true
panic = "abort"

[profile.test-util]
inherits = "test"
